{% extends 'base.html' %}{% block title %}{{ 'Edit' if sermon else 'New' }} sermon · {{ app_name }}{% endblock %}{% block heading %}{{ 'Edit sermon' if sermon else 'New sermon' }}{% endblock %}{% block content %}<form class="panel form-grid" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" value="{{ sermon.title if sermon else '' }}" required placeholder="Sermon or study title"></label><label>Date and time<input type="datetime-local" name="sermon_date" value="{{ sermon.sermon_date.strftime('%Y-%m-%dT%H:%M') if sermon else '' }}"></label><label>Speaker<input name="speaker" value="{{ sermon.speaker if sermon else '' }}"></label><label>Church / event / location<input name="location" value="{{ sermon.location if sermon else '' }}"></label><label>Topic<input name="topic" value="{{ sermon.topic if sermon else '' }}"></label><label class="wide">Notes<textarea name="content" rows="18" placeholder="Write the message, observations, questions, and applications…">{{ sermon.content if sermon else '' }}</textarea></label><div class="form-actions"><button class="button primary">Save sermon</button><a class="button" href="{{ url_for('main.sermons') }}">Cancel</a></div></form>{% endblock %}
